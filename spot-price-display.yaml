# Spot price display: ESP32-2432S028R ("Cheap Yellow Display", 2.8" 320x240).
# Shows the total electricity price now (spot + margin + transfer + tax, c/kWh incl. VAT) as a big coloured area,
# and the next 12 h as a bar chart. Read-only: it never switches anything.
#
# Build/flash: esphome run spot-price-display.yaml   (needs secrets.yaml, see secrets.example.yaml)
# Settings (fees, colour limits) can be changed from the web page at http://spot-price-display.local/

substitutions:
  name: spot-price-display
  # Board variant: most CYDs are ILI9341. If colours look inverted, flip invert_colors.
  # If the picture is mirrored/upside down, change mirror_x / mirror_y.
  display_model: ILI9341
  invert_colors: "false"
  mirror_x: "true"
  mirror_y: "false"
  price_url: https://api.porssisahko.net/v2/latest-prices.json

esphome:
  name: ${name}
  friendly_name: Spot price display
  includes:
    - spot_price_logic.h
    - spot_state.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf  # esp-idf has the CA bundle for https with verify_ssl

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Spot price display"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# A small web page for changing the settings below (no Home Assistant needed).
web_server:
  port: 80

# To use Home Assistant instead, add:
# api:
#   encryption:
#     key: !secret api_key

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Helsinki
    on_time_sync:
      then:
        - script.execute: fetch_prices

http_request:
  id: http
  verify_ssl: true
  timeout: 15s

script:
  - id: fetch_prices
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - http_request.get:
                url: ${price_url}
                capture_response: true
                max_response_buffer_size: 32768
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("prices", "HTTP %d", response->status_code);
                          return;
                        }
                        spot::PriceTable *tmp = spot::spare;
                        tmp->clear();
                        bool ok = json::parse_json(body, [tmp](JsonObject root) -> bool {
                          JsonArray arr = root["prices"];
                          if (arr.isNull()) return false;
                          for (JsonObject p : arr) {
                            const char *start = p["startDate"];
                            if (start == nullptr || !p["price"].is<float>()) continue;
                            tmp->add(spot::parse_iso_utc(start), p["price"].as<float>());
                          }
                          return true;
                        });
                        if (!ok || tmp->count == 0) {
                          ESP_LOGW("prices", "could not parse the price list");
                          return;
                        }
                        tmp->last_fetch = id(sntp_time).now().timestamp;
                        // Swap the tables so the display never sees a half-filled one.
                        spot::spare = spot::current;
                        spot::current = tmp;
                        ESP_LOGI("prices", "%d slots, known until %ld", tmp->count, (long) tmp->known_until());
                        id(tft).update();
                on_error:
                  then:
                    - logger.log:
                        level: WARN
                        format: "price fetch failed"

# Fetch hourly, and every 15 min from 14:00 local until tomorrow's prices are in.
interval:
  - interval: 15min
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;
          spot::PriceTable *t = spot::current;
          long since = (long) (now.timestamp - t->last_fetch);
          bool waiting_for_tomorrow = now.hour >= 14 && (long) (t->known_until() - now.timestamp) < 12 * 3600;
          if (t->last_fetch == 0 || since >= 3600 - 60 || waiting_for_tomorrow)
            id(fetch_prices).execute();
  # Redraw so the colour changes on the quarter-hour.
  - interval: 30s
    then:
      - component.update: tft

# ---- Settings (stored in flash, editable on the web page). Placeholders until the bill values are known. ----
number:
  - platform: template
    id: margin
    name: "Seller's margin"
    unit_of_measurement: "c/kWh"
    optimistic: true
    restore_value: true
    initial_value: 0.49
    min_value: 0
    max_value: 10
    step: 0.01
  - platform: template
    id: transfer
    name: "Transfer fee"
    unit_of_measurement: "c/kWh"
    optimistic: true
    restore_value: true
    initial_value: 4.0
    min_value: 0
    max_value: 20
    step: 0.01
  - platform: template
    id: elec_tax
    name: "Electricity tax"
    unit_of_measurement: "c/kWh"
    optimistic: true
    restore_value: true
    initial_value: 2.83
    min_value: 0
    max_value: 10
    step: 0.01
  - platform: template
    id: green_below
    name: "Green below"
    unit_of_measurement: "c/kWh"
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 100
    step: 0.5
  - platform: template
    id: red_from
    name: "Red from"
    unit_of_measurement: "c/kWh"
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 0
    max_value: 100
    step: 0.5

# ---- Hardware ----
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO21

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      number: GPIO12
      ignore_strapping_warning: true  # wired on the board
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_big
    size: 64
    glyphs: "0123456789.,-"
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_mid
    size: 22
  - file:
      type: gfonts
      family: Roboto
    id: font_small
    size: 13

display:
  - platform: ili9xxx
    id: tft
    model: ${display_model}
    spi_id: tft_spi
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    invert_colors: ${invert_colors}
    color_palette: 8BIT  # 320x240 at 8 bits = 77 kB buffer; fits without PSRAM
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: ${mirror_x}
      mirror_y: ${mirror_y}
    update_interval: never  # redrawn by the 30 s interval and after each fetch
    lambda: |-
      const Color GREEN(0x1E, 0xA0, 0x46), YELLOW(0xF5, 0xC5, 0x18), RED(0xD6, 0x2A, 0x2A);
      const Color GREY(0x60, 0x60, 0x60), WHITE(0xFF, 0xFF, 0xFF), DARK(0x20, 0x20, 0x20);
      const Color LINE(0x90, 0x90, 0x90);
      auto colour_of = [&](spot::Colour c) -> Color {
        switch (c) {
          case spot::GREEN: return GREEN;
          case spot::YELLOW: return YELLOW;
          case spot::RED: return RED;
          default: return GREY;
        }
      };

      spot::Settings s;
      s.margin = id(margin).state;
      s.transfer = id(transfer).state;
      s.tax = id(elec_tax).state;
      s.green_below = id(green_below).state;
      s.red_from = id(red_from).state;

      it.fill(Color::BLACK);
      auto now = id(sntp_time).now();
      const spot::PriceTable *t = spot::current;
      const int TOP_H = 130;

      // ---- Top: colour now, big price, when green ----
      if (!now.is_valid()) {
        it.filled_rectangle(0, 0, 320, TOP_H, GREY);
        it.print(160, TOP_H / 2, id(font_mid), WHITE, TextAlign::CENTER,
                 wifi::global_wifi_component->is_connected() ? "Waiting for time..." : "No Wi-Fi");
        return;
      }
      time_t tnow = now.timestamp;
      int idx = t->index_at(tnow);
      spot::Colour c = t->colour_now(s, tnow);
      it.filled_rectangle(0, 0, 320, TOP_H, colour_of(c));
      Color text = (c == spot::YELLOW) ? DARK : WHITE;

      if (idx < 0) {
        it.print(160, 50, id(font_mid), text, TextAlign::CENTER, "No price data");
        it.print(160, 85, id(font_small), text, TextAlign::CENTER,
                 wifi::global_wifi_component->is_connected() ? "price service not answering" : "no Wi-Fi");
      } else {
        char buf[16];
        snprintf(buf, sizeof(buf), "%.1f", spot::total_price(s, t->slots[idx]));
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, buf, id(font_big), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        int unit_w = 62;
        int x = (320 - w - unit_w) / 2;
        it.print(x, 8, id(font_big), text, TextAlign::TOP_LEFT, buf);
        it.print(x + w + 6, 8 + h - 6, id(font_mid), text, TextAlign::BOTTOM_LEFT, "c/kWh");

        time_t g = t->next_green_start(s, tnow);
        char line[40];
        if (c == spot::GREEN) {
          snprintf(line, sizeof(line), "Cheap now");
        } else if (g == 0) {
          snprintf(line, sizeof(line), "No green in known prices");
        } else {
          ESPTime gt = ESPTime::from_epoch_local(g);
          bool tomorrow = gt.day_of_year != now.day_of_year;
          snprintf(line, sizeof(line), "Green from %s%02d:%02d", tomorrow ? "tomorrow " : "", gt.hour, gt.minute);
        }
        it.print(160, 100, id(font_mid), text, TextAlign::CENTER, line);
      }
      if (t->fetch_stale(tnow))
        it.print(4, 2, id(font_small), text, TextAlign::TOP_LEFT, "offline");

      // ---- Bottom: next 12 h, 48 quarter-hour bars ----
      const int N = 48, CH_TOP = 138, CH_BOT = 222;
      if (idx < 0) return;
      float maxv = s.red_from + 2.0f;
      for (int i = 0; i < N && idx + i < t->count; i++) {
        float v = spot::total_price(s, t->slots[idx + i]);
        if (v > maxv) maxv = v;
      }
      auto y_of = [&](float v) -> int {
        if (v < 0) v = 0;
        return CH_BOT - (int) ((CH_BOT - CH_TOP) * v / maxv);
      };
      for (int i = 0; i < N && idx + i < t->count; i++) {
        const spot::Slot &sl = t->slots[idx + i];
        float v = spot::total_price(s, sl);
        int x0 = i * 320 / N, x1b = (i + 1) * 320 / N - 1;
        int y = y_of(v);
        if (y > CH_BOT - 1) y = CH_BOT - 1;  // always at least 1 px
        it.filled_rectangle(x0, y, x1b - x0, CH_BOT - y, colour_of(spot::colour_for(s, v)));
        if (i == 0)
          it.rectangle(x0, y - 1, x1b - x0, CH_BOT - y + 1, WHITE);
        ESPTime lt = ESPTime::from_epoch_local(sl.start);
        if (lt.minute == 0 && lt.hour % 3 == 0) {
          it.line(x0, CH_BOT, x0, CH_BOT + 3, LINE);
          it.printf(x0, CH_BOT + 4, id(font_small), LINE, TextAlign::TOP_CENTER, "%02d", lt.hour);
        }
      }
      // dashed lines at the colour limits
      for (float lim : {s.green_below, s.red_from}) {
        int y = y_of(lim);
        for (int x = 0; x < 320; x += 6)
          it.line(x, y, x + 2, y, LINE);
      }
